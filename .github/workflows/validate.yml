name: Validate references

on:
  push:
    paths:
      - "references/**"
  pull_request:
    paths:
      - "references/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every reference has ATTRIBUTION.md with required fields
        run: |
          fail=0
          for dir in references/*/; do
            [ -d "$dir" ] || continue
            file="${dir}ATTRIBUTION.md"
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"; fail=1; continue
            fi
            for field in "Original repository" "Author" "License"; do
              grep -q "$field" "$file" || { echo "MISSING FIELD '$field' in $file"; fail=1; }
            done
            # URL field: accept either "Original URL" (old template) or
            # "Original repository" (new template) — both carry the source URL.
            grep -q "Original URL" "$file" || grep -q "Original repository" "$file" || { echo "MISSING URL FIELD in $file"; fail=1; }
            # License file: accept common upstream spellings (incl. .txt).
            [ -f "${dir}LICENSE" ] || [ -f "${dir}LICENSE.md" ] || [ -f "${dir}license.md" ] || [ -f "${dir}LICENSE.txt" ] || [ -f "${dir}license.txt" ] || { echo "MISSING LICENSE in $dir"; fail=1; }
          done
          exit $fail

      - name: No nested git repos (snapshots only, no submodules)
        run: |
          if find references -name ".git" -maxdepth 3 | grep -q .; then
            echo "Nested .git found — mirrors must be plain snapshots"; exit 1
          fi
          echo "OK: no nested git repos"
